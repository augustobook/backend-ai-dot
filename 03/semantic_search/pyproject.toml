[project]
name = "semantic-search"
version = "0.1.0"
description = "Hybrid semantic search over blog posts: transformers embeddings, FAISS, BM25 and a cross-encoder re-ranker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4.1",
    "dash-ag-grid>=35.3.0",
    "dash-bootstrap-components>=2.0.4",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "gunicorn>=26.2.0",
    "numpy>=2.5.4",
    "openai>=3.41.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "python-frontmatter>=1.3.0",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "torch>=2.15.0",
    "transformers>=5.21.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

# Building the project as a package makes `app` importable from anywhere
# (scripts/, Dash, uvicorn) without touching sys.path.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# CPU-only PyTorch: the default PyPI wheels bundle the CUDA libraries, which would
# add several GB to the environment and the Docker image without any benefit here.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "T20", # flake8-print (logs must go through `logging`)
]

[tool.ruff.lint.per-file-ignores]
# The scripts report their results to the terminal on purpose.
"scripts/*" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "tests"]

[[tool.mypy.overrides]]
# These libraries ship without type information.
module = [
    "faiss",
    "faiss.*",
    "rank_bm25",
    "frontmatter",
    "frontmatter.*",
    "dash_bootstrap_components",
    "dash_ag_grid",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Dash testing plugin (Selenium-based browser tests) is not used here.
addopts = "-ra -m 'not slow' -p no:dash"
markers = [
    "slow: downloads and runs the real models (run with `uv run pytest -m slow`)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
